<header class="app-topbar">
  <div class="d-flex align-items-center gap-3">
    <button class="btn btn-sm btn-outline-secondary d-lg-none" id="sidebarToggle" type="button" aria-label="Toggle navigation">
      <i class="bi bi-list fs-5"></i>
    </button>
    <div class="fw-semibold text-secondary d-none d-sm-block">
      {% block page_title %}Complaint Management System{% endblock %}
    </div>
  </div>

  <div class="d-flex align-items-center gap-3">
    {% if not request.user.is_superuser and not request.user.is_staff and request.user.profile.role != 'ADMIN' %}
      <a href="{% url 'complaint_create' %}" class="btn btn-sm btn-primary d-flex align-items-center gap-2">
        <i class="bi bi-plus-lg"></i>
        <span>New Complaint</span>
      </a>
    {% endif %}

    <div class="dropdown">
      <button class="btn btn-link text-dark p-0 text-decoration-none dropdown-toggle d-flex align-items-center gap-2" type="button" data-bs-toggle="dropdown" aria-expanded="false">
        <div class="rounded-circle bg-primary-subtle text-primary fw-bold d-flex align-items-center justify-content-center" style="width: 34px; height: 34px;">
          {{ request.user.first_name|default:request.user.username|slice:":1"|upper }}
        </div>
        <span class="d-none d-md-inline small fw-medium">{{ request.user.username }}</span>
      </button>
      <ul class="dropdown-menu dropdown-menu-end shadow-sm">
        <li><h6 class="dropdown-header">Signed in as <strong>{{ request.user.username }}</strong></h6></li>
        <li><a class="dropdown-item" href="{% url 'profile' %}"><i class="bi bi-person me-2"></i>My Profile</a></li>
        <li><a class="dropdown-item" href="{% url 'change_password' %}"><i class="bi bi-key me-2"></i>Change Password</a></li>
        <li><hr class="dropdown-divider"></li>
        <li><a class="dropdown-item text-danger" href="{% url 'logout' %}"><i class="bi bi-box-arrow-right me-2"></i>Sign Out</a></li>
      </ul>
    </div>
  </div>
</header>
